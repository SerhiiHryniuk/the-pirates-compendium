<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
  <div class="container">

    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'compendium:index' %}">
      <i class="bi bi-compass fs-4 text-warning"></i>
      The Pirates Compendium
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link" href="{% url 'compendium:skill_list' %}">
            <i class="bi bi-lightning-charge me-1 text-warning"></i>Skills
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'compendium:devil_fruit_list' %}">
            <i class="bi bi-circle-half me-1 text-info"></i>Devil Fruits
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'compendium:monster_list' %}">
            <i class="bi bi-shield-exclamation me-1 text-danger"></i>Monsters
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'compendium:scenario_list' %}">
            <i class="bi bi-map me-1 text-success"></i>Scenarios
          </a>
        </li>

      </ul>

      <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
          <span class="text-muted small">
            <i class="bi bi-person-circle me-1"></i>{{ user.username }}
          </span>
          <form action="{% url 'logout' %}" method="post" class="d-inline m-0">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.path }}">
            <button type="submit" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
          </form>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-warning btn-sm">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
          </a>
        {% endif %}
      </div>

    </div>
  </div>
</nav>
