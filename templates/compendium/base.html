<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}The Pirates Compendium{% endblock %}</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/darkly/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 16'><text y='14' font-size='16'>🧭</text></svg>">

  {% block extra_head %}{% endblock %}
</head>
<body>

  {% include "compendium/includes/navbar.html" %}

  <main class="py-4">
    <div class="container">
      {% block page_header %}{% endblock %}
      {% block content %}{% endblock %}
    </div>
  </main>

  {% include "compendium/includes/footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>

  {% block extra_scripts %}{% endblock %}

</body>
</html>
