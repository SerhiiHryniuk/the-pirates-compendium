<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Pirates Compendium - Devil fruit detail</title>
</head>
<body>
  <h1>The Pirates Compendium - Devil fruit detail</h1>
  {% if user.is_authenticated %}
    <p>User: {{ user.username }}</p>
    <form action="{% url "logout" %}" method=post>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.path }}" />
      <button type="submit">Logout</button>
    </form>
  {% else %}
    <a href="{% url "login" %}">Login</a>
  {% endif %}
  <br>
  <a href="{% url "compendium:index" %}">Home</a>
  <br>
  <a href="{% url "compendium:skill_list" %}">Skills</a>
  <br>
  <a href="{% url "compendium:devil_fruit_list" %}">Devil fruits</a>
  <br>
  <a href="{% url "compendium:monster_list" %}">Monsters</a>
  <br>
  <a href="{% url "compendium:scenario_list" %}">Scenarios</a>
  <h2>Devil fruit {{ devil_fruit_detail }}</h2>
  <a href="{% url "compendium:devil_fruit_pdf" slug=devil_fruit_detail.slug %}" target="_blank">
    Download PDF
  </a>
</body>
</html>
